name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 作業記録の仕組みが壊れていないかだけを見る最小ジョブ（土台フェーズ）
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 作業記録ファイルの存在確認
        run: |
          test -f docs/DESIGN.md
          test -f docs/implementation-log.md
          test -f CLAUDE.md

