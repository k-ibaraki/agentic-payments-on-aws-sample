name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 作業記録の仕組みが壊れていないかだけを見る最小ジョブ（土台フェーズ）
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 作業記録ファイルの存在確認
        run: |
          test -f docs/DESIGN.md
          test -f docs/implementation-log.md
          test -f CLAUDE.md

  billing-mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: billing-mcp/server
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:ui

  billing-mcp-cdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # CDK のバンドル（esbuild）はサーバーの依存を解決し、
      # vite singlefile の出力を zip に同梱するため、先に server を用意する
      - name: サーバーの依存と UI ビルド
        working-directory: billing-mcp/server
        run: |
          pnpm install --frozen-lockfile
          pnpm build:ui
      - name: CDK の依存
        working-directory: billing-mcp
        run: pnpm install --frozen-lockfile
      # 雛形の payToAddress はゼロアドレスで、スタックのガードが合成を止める
      # （書き換え忘れたままのデプロイで売上が焼却されるのを防ぐため）。
      # CI は合成のみでデプロイしないので、検証用のダミーに置換して通す
      - name: パラメータ雛形を配置（parameter.ts は gitignore）
        working-directory: billing-mcp
        run: |
          cp parameter.sample.ts parameter.ts
          sed -i 's/0x0000000000000000000000000000000000000000/0x2222222222222222222222222222222222222222/' parameter.ts
      - name: 型検査とスタックのテスト
        working-directory: billing-mcp
        run: |
          pnpm typecheck
          pnpm test
      # 合成した成果物が実際に読み込めるかまで見る。ESM 出力に CJS 配布の依存を
      # 同梱すると実行時に落ちるが、これはデプロイするまで露見しないため
      - name: 合成とバンドル検証
        working-directory: billing-mcp
        run: |
          pnpm synth
          pnpm verify:bundle

  # ---- 以下は実装が入り次第有効化する骨格（agent-app）----
