<!DOCTYPE html>
<!--
  存在しないパスに返す体裁用のページ（決定45）。Vite が public/ から dist/ の直下へそのまま写し、
  Amplify Hosting の規則 `/<*> → /404.html (404)` がこれを返す。
  ビルドに依存しないよう、外部の CSS・JS は読まず自己完結にしてある。
-->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — ページが見つかりません</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f7fc; color: #1f2d3d;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { margin: 0 0 1.5rem; color: #52657a; }
    a { color: #2c6fb0; }
  </style>
</head>
<body>
  <main>
    <h1>404 — ページが見つかりません</h1>
    <p>このアプリはトップページだけで動きます。</p>
    <a href="/">トップページへ戻る</a>
  </main>
</body>
</html>
